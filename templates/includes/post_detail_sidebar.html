<!-- RIGHT SECTOR SIDEBAR: CURATED DETAILS & READ MORE RECOMMENDATIONS -->
<aside class="col-span-1 lg:col-span-3 space-y-6 lg:sticky lg:top-24 w-full">
    
    <!-- Highlights Selection Column Container -->
    <div class="bg-base-100 border border-base-200/60 shadow-sm rounded-2xl p-5 space-y-4">
        <h3 class="text-center md:text-left font-medium text-xs tracking-widest uppercase text-base-content/40 pb-2 border-b border-base-100">
            Highlights｜精選分享
        </h3>
        
        <div class="flex flex-col gap-4">
            {% for highlight in posts %}
            <a href="{{ highlight.get_url }}" class="group flex gap-3 p-1.5 rounded-xl hover:bg-base-50 transition-all duration-300 min-w-0">
                
                <div class="w-16 h-16 rounded-xl overflow-hidden bg-base-200 border border-base-200/30 flex-shrink-0 relative">
                    <img src="{{ highlight.featured_image.url }}" alt="{{ highlight.title }}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" loading="lazy">
                </div>
                <div class="flex flex-col justify-center min-w-0 flex-1">
                    <span class="text-xs font-semibold text-base-content/80 group-hover:text-primary transition-colors line-clamp-1 mb-0.5">
                        {{ highlight.title }}
                    </span>
                    <span class="text-[11px] text-base-content/40 leading-relaxed line-clamp-2 font-light">
                        {{ highlight.short_description }}
                    </span>
                </div>
            </a>
            {% empty %}
            <div class="text-center text-xs opacity-40 py-4 font-light">暫無精選推薦｜No highlights yet.</div>
            {% endfor %}
        </div>
    </div>

    <!-- Random Portrait Art Exhibition Display Widget Frame Slot -->
    {% if random_img_path %}
    <div class="hidden lg:block w-full aspect-[3/4] rounded-2xl overflow-hidden shadow-sm border border-base-200/50 bg-base-200 relative group">
        <img src="{{ random_img_path }}" alt="Art Capture Feature" class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-[1.01]" loading="lazy">
        <div class="absolute inset-0 bg-base-950/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"></div>
    </div>
    {% endif %}

</aside>
