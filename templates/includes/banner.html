<!-- ULTRA-COMPACT SUB-BANNER MODULE (Matched with post.html styling) -->
<div class="relative w-full bg-base-300 py-4 border-b border-base-200 select-none">
  <!-- 🌟 FIXED: Swapped items-center for items-start to collapse the vertical centering plane of the row layout -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-start justify-between gap-4">
    
    <!-- LEFT CONTENT: CORE METRICS & BREADCRUMBS IN A SINGLE PLIABLE COLUMN -->
    <!-- Kept items-center on desktop view (sm:items-center) so breadcrumbs cross-align cleanly when flat -->
    <div class="flex-1 min-w-0 flex flex-col sm:flex-row sm:items-center sm:gap-4 space-y-1 sm:space-y-0 pt-0.5">
      
      <!-- Main Dynamic Title with Editorial Serif Font Styling -->
      <div class="flex items-center gap-2 flex-shrink-0">
        <h1 class="text-sm sm:text-base font-serif font-bold tracking-widest text-base-content truncate">
          {{ main_title }}
        </h1>
        {% if search_keyword %}
          <span class="text-[10px] font-sans font-light opacity-70 px-1.5 py-0.5 rounded bg-primary/10 text-primary">
            "{{ search_keyword }}"
          </span>
        {% endif %}
      </div>

      <!-- Divider (Hidden on Mobile) -->
      <span class="hidden sm:inline text-base-content/20 text-xs">/</span>

      <!-- Sub-headers / Breadcrumbs Track Combined to Save Vertical Space -->
      <p class="text-[11px] tracking-wide text-base-content/50 font-serif truncate">
        {{ sub_title_1 }}
      </p>

      <div id="banner-subpage-title-container" class="flex items-center gap-2">
        {% if sub_title_2 %}
          <span class="hidden sm:inline text-base-content/20 text-xs">/</span>
          <p class="text-[11px] tracking-wide text-neutral/80 font-serif truncate">
            <span id="banner_sub_title_2" class="opacity-70">{{ sub_title_2 }}</span>
          </p>
        {% endif %}
      </div>

    </div>

    <!-- RIGHT CONTENT: COMPACT RESPONSIVE DRAWER TOGGLE (Mobile & Pad Viewports Only) -->
    <!-- 🌟 FIXED: Added a micro top padding step (pt-0.5) to keep the icon axis perfectly level with the h1 text font -->
    <div class="flex items-start lg:hidden flex-shrink-0 pt-0.5">
      <label for="dashboard-drawer" class="btn btn-ghost btn-xs sm:btn-sm btn-circle hover:bg-base-200 text-base-content/70 focus:outline-none focus:ring-0" aria-label="Toggle Dashboard Menu">
        <svg xmlns="http://w3.org" class="h-4 w-4 sm:h-5 sm:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </label>
    </div>
  </div>
</div>
