<!-- templates/emails/product_submission_notification.html -->
<!DOCTYPE html>
<html><body style="font-family:Georgia,serif;color:#333;max-width:600px;margin:0 auto;padding:24px;">
  <h2 style="font-weight:400;letter-spacing:2px;">🛍️ New Product Submission｜新作品待審</h2>
  <p style="font-size:14px;line-height:1.6;">
    匠人 <strong>{{ artisan_label }}</strong> 提交了新作品，等待審核：
  </p>
  <p style="font-size:15px;font-weight:600;">{{ product.product_name }}</p>
  <p style="font-size:13px;color:#666;">{{ product.description|truncatechars:140 }}</p>
  <p style="margin-top:24px;">
    <a href="{{ review_url }}"
       style="background:#8b6f47;color:#fff;padding:10px 20px;text-decoration:none;border-radius:4px;font-size:13px;">
       Open Review Queue｜前往審核
    </a>
  </p>
  <hr style="border:none;border-top:1px solid #eee;margin:32px 0;">
  <p style="font-size:11px;color:#999;">Hṛdayadīpa 心燈之屋 · {{ year }}</p>
</body></html>
