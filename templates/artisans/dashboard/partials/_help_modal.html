<!-- templates/artisans/dashboard/partials/_help_modal.html -->
<dialog id="help-modal" class="modal">
    <div class="modal-box max-w-lg">
        <button type="button"
                class="btn btn-sm btn-circle btn-ghost absolute right-3 top-3"
                onclick="document.getElementById('help-modal').close()">✕</button>
        <div id="help-modal-body"></div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<script>
(function () {
    if (window._helpModalBound) return;
    window._helpModalBound = true;
    document.addEventListener('click', function (e) {
        const btn = e.target.closest('[data-help-open]');
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();
        const tpl = document.getElementById(btn.dataset.helpOpen);
        const modal = document.getElementById('help-modal');
        if (!tpl || !modal) {
            console.warn('[help] missing template or modal:', btn.dataset.helpOpen);
            return;
        }
        const body = modal.querySelector('#help-modal-body');
        body.innerHTML = '';
        body.appendChild(tpl.content.cloneNode(true));
        modal.showModal();
    });
})();
</script>
