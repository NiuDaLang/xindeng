<!-- artisans/dashboard/partials/_messages_admin_panel.html -->

<div class="mb-8">
    <h1 class="font-serif text-2xl tracking-wide">Admin Thread｜平台對話</h1>
    <p class="text-sm text-base-content/50 mt-1">
        與平台管理員的直接對話。瑣碎事務可用此處；正式往來請仍以電郵為準。
        <br>
        <span class="text-[11px] opacity-70">Direct chat with the platform. Use email for anything formal.</span>
    </p>
</div>
{% include 'includes/alerts.html' %}

<section class="border border-base-200/60 rounded-2xl bg-base-100 flex flex-col max-w-3xl">
    <!-- OOB error banner target (also written here on initial render as empty) -->
    <div id="admin-message-error"></div>

    <div id="admin-message-list" class="flex-1 overflow-y-auto p-4 space-y-3 max-h-[60vh]">
        {% include 'artisans/dashboard/partials/_messages_admin_list.html' with admin_messages=admin_messages %}
    </div>

    <form method="post"
          action="{% url 'a_dashboard_messages_admin_send' %}"
          enctype="multipart/form-data"
          hx-post="{% url 'a_dashboard_messages_admin_send' %}"
          hx-target="#admin-message-list"
          hx-swap="innerHTML"
          hx-encoding="multipart/form-data"
          hx-disabled-elt="find button[type=submit]"
          class="border-t border-base-200/60 p-3 flex flex-col gap-2 w-full">
        {% csrf_token %}
        <textarea id="admin-message-content" name="content" maxlength="2000" rows="2"
                  placeholder="Write a short message…｜輸入訊息…"
                  class="textarea textarea-bordered w-full text-xs rounded-xl"></textarea>
        <div class="flex items-center gap-2 w-full">
            <input type="file" name="image" accept="image/*"
                   class="file-input file-input-bordered file-input-xs flex-1 text-xs" />
            <button type="submit" class="btn btn-primary btn-sm rounded-xl shrink-0">
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </div>
    </form>
</section>
<script>
    function adminScrollToBottom() {
        const container = document.getElementById('admin-message-list');
        if (container) container.scrollTop = container.scrollHeight;
    }
    // Run on full page load OR when this template is swapped in.
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', adminScrollToBottom);
    } else {
        adminScrollToBottom();
    }
    // Clear input + scroll only on a successful send.
    if (!window._adminMessageSentListenerInstalled) {
        window._adminMessageSentListenerInstalled = true;
        document.body.addEventListener('adminMessageSent', () => {
            const ta = document.getElementById('admin-message-content');
            if (ta) ta.value = '';
            const file = document.querySelector('input[type=file][name=image]');
            if (file) file.value = '';
            setTimeout(adminScrollToBottom, 50);
        });
    }
</script>
