<a href="{{ post.get_url }}"
   class="group block bg-white hover:bg-[#fefdfb] border border-base-200/60 rounded-2xl overflow-hidden transition-all duration-300 shadow-sm hover:shadow-md">

    {% if post.featured_image %}
    <div class="aspect-video bg-base-200 overflow-hidden">
        <img src="{{ post.featured_image.url }}"
             alt="{{ post.title }}"
             class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
             loading="lazy" />
    </div>
    {% endif %}

    <div class="p-5">
        <h3 class="font-serif text-base font-semibold text-base-content group-hover:text-primary transition-colors line-clamp-2 leading-snug">
            {{ post.title }}
        </h3>

        {% if post.short_description %}
        <p class="text-xs text-base-content/60 mt-2 line-clamp-2 leading-relaxed">
            {{ post.short_description }}
        </p>
        {% endif %}

        <div class="mt-4 pt-3 border-t border-base-200/50 text-[10px] text-base-content/40 font-light">
            {{ post.created_at|date:"Y-m-d" }}
        </div>
    </div>
</a>
