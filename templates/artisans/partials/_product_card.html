<!-- _product_card.html -->
<a href="{{ product.get_url }}"
   class="group block bg-white hover:bg-[#fefdfb] border border-base-200/60 rounded-2xl overflow-hidden transition-all duration-300 shadow-sm hover:shadow-md">

    <!-- Product image -->
    <div class="aspect-square bg-base-200 overflow-hidden">
        {% if product.images %}
        <img src="{{ product.images.url }}"
             alt="{{ product.product_name }}"
             class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
             loading="lazy" />
        {% else %}
        <div class="w-full h-full flex items-center justify-center text-base-content/25 font-serif text-3xl">
            {{ product.product_name|slice:":1" }}
        </div>
        {% endif %}
    </div>

    <!-- Info -->
    <div class="p-4">
        <h3 class="font-serif text-sm font-semibold text-base-content group-hover:text-primary transition-colors line-clamp-2 leading-snug">
            {{ product.product_name }}
        </h3>

        {% if product.lowest_price %}
        <p class="text-[11px] text-base-content/60 mt-1 font-sans">
            From ¥{{ product.lowest_price|floatformat:2 }}
        </p>
        {% endif %}
    </div>
</a>
