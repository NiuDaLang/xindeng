<title>{{ page_title }}</title>
{% load static %}
{% load humanize %}

<div id="dashboard_addresses" class="subpage w-full animate-fade-in space-y-6">
    <!-- ================================================================
         🎨 FIRST ROW: SEASONAL HERO & CLOCK INTEGRATION WIDGET
         ================================================================ -->
    {% include 'accounts/partials/standard_horizontal_hero.html' %}
    <!-- ================================================================
         🎨 SECOND ROW: ADDRESS DIRECTORY MESH GRID
         ================================================================ -->
    <div class="w-full space-y-4">
        <div class="flex items-center justify-between border-b border-base-200 pb-2 select-none">
            <h3 class="text-xs sm:text-sm font-bold tracking-widest font-serif text-base-content/80 uppercase flex items-center gap-2">
                <i class="fa-solid fa-map-location-dot text-primary"></i> Shipping Registries Directory｜地址簿明細
            </h3>
        </div>

        <!-- RE-RENDERABLE DATA LIST PACK CONTAINER -->
        <div id="address-list-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 w-full items-start">
            {% include 'accounts/partials/address_list_partial.html' %}
        </div>
        
        <!-- ADD REGISTRY QUICK ACTION FLOATER -->
        <div class="relative card w-full min-h-[5rem] justify-center items-center pt-4">
            <button class="btn btn-primary btn-circle w-[3.5rem] h-[3.5rem] shadow-lg shadow-primary/20 transition-all hover:scale-105"
                    onclick="this.blur(); window.openEmptyAddressForm('create_address_form'); my_modal_1.showModal();">
                <i class="fa-solid fa-plus text-xl text-white"></i>
            </button>
        </div>
    </div>
</div>

<!-- ================================================================
     🛡️ DIALOG FRAMEWORKS (MODAL STRUCTURE MANAGEMENT)
     ================================================================ -->
<dialog id="my_modal_1" class="modal bg-neutral-900/40 backdrop-blur-sm z-50">
    <div class="modal-box rounded-2xl border border-info/20 shadow-xl bg-base-100 max-w-lg p-3 xs:p-6 relative">
        <button class="btn btn-sm btn-circle btn-ghost absolute right-4 top-4 text-base-content/40" onclick="window.closeAddressForm('create_address_form'); my_modal_1.close()">✕</button>
        <h3 class="font-serif font-bold text-sm tracking-wider text-base-content/80 border-b border-base-200 pb-2">Add New Address｜添加新地址</h3>
        <div id="create_address_modal_content_area" class="w-full pt-4">
            {% include 'accounts/partials/address_form.html' %}
        </div>
    </div>
</dialog>

<dialog id="my_modal_2" class="modal bg-neutral-900/40 backdrop-blur-sm z-50">
    <div class="modal-box rounded-2xl border border-info/20 shadow-xl bg-base-100 max-w-lg p-3 xs:p-6 relative">
        <button class="btn btn-sm btn-circle btn-ghost absolute right-4 top-4 text-base-content/40" onclick="window.closeAddressForm('update_address_form'); my_modal_2.close()">✕</button>
        <h3 class="font-serif font-bold text-sm tracking-wider text-base-content/80 border-b border-base-200 pb-2">Update Address｜更新地址</h3>
        <div id="modal_content_area" class="w-full pt-4"></div>
    </div>
</dialog>

<!-- =========================================================================
     ⚙️ HIGH-SECURITY FLICKER PROTECTION & INTERACTIVE LOGIC HARDENING
     ========================================================================= -->
<script>
  (function() {
      console.log("⚙️ Profile Autocomplete Debounce Protection Engine Engaged.");
      const formElement = document.getElementById("profile_form");
      if (!formElement) return;

      // 🌟 STEP 3 DEBOUNCE SOLUTION ENFORCED
      // Wraps inputs inside a 250ms timer window. This prevents your script from 
      // aggressively querying Google API modules on every micro keystroke, 
      // permanently ending the focus-trap grey screen flicker exception.
      let verificationDebounceTimeout;
      const targetAddressField = document.getElementById("id_address_line_1");

      if (targetAddressField) {
          targetAddressField.addEventListener("input", () => {
              clearTimeout(verificationDebounceTimeout);
              verificationDebounceTimeout = setTimeout(() => {
                  // If autocomplete loops are registered globally, fire them cleanly 
                  // only when the customer stops typing
                  if (typeof window.updatePayButtonState === "function") {
                      window.updatePayButtonState();
                  }
              }, 250); 
          });
      }

      // Automatically re-mount and tick analog clock indicators inside the active viewport [INDEX]
      if (typeof initializeAnalogClockLayout === "function") {
          initializeAnalogClockLayout();
      }
  })();
</script>
