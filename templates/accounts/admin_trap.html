<!-- templates/accounts/admin_trap.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>Sign in｜登入</title>
  <style>
    body { background:#f8f8f8; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin:0; }
    #container { width: 28rem; margin: 8vh auto 0; }
    h1 { font-size: 1.25rem; font-weight: 400; color:#666; text-align:center; margin: 0 0 1.5rem; }
    form { background:#fff; border:1px solid #eaeaea; border-radius:6px; padding:1.5rem; }
    label { display:block; font-size:0.85rem; color:#333; margin-bottom:0.25rem; }
    input { width:100%; box-sizing:border-box; padding:0.5rem 0.75rem; border:1px solid #ccc; border-radius:4px; font-size:0.9rem; }
    .row + .row { margin-top:1rem; }
    button { margin-top:1.25rem; background:#417690; color:#fff; border:none; padding:0.55rem 1.1rem; border-radius:4px; font-size:0.9rem; cursor:pointer; }
    button:hover { background:#365a6d; }
  </style>
</head>
<body>
  <div id="container">
    <h1>Sign in</h1>
    <form method="post" action="">
      <!-- NO CSRF token here — decoy form -->
      <div class="row">
        <label for="id_username">Username:</label>
        <input type="text" name="username" id="id_username" autocomplete="off" autofocus>
      </div>
      <div class="row">
        <label for="id_password">Password:</label>
        <input type="password" name="password" id="id_password" autocomplete="off">
      </div>
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
