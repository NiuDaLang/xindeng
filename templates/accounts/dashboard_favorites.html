<!-- dashboard_favorites.html -->
{% load humanize %}
<title>{{ page_title }}</title>

<div id="dashboard_favorites" class="subpage w-full animate-fade-in space-y-6">
    <!-- ================================================================
         🎨 FIRST ROW: PERSISTENT STANDARD REGISTRY HERO
         ================================================================ -->
    {% include 'accounts/partials/standard_horizontal_hero.html' %}

    <!-- ================================================================
         🎨 SECOND ROW: CURATED FAVORITES CATALOG VIEWPORT
         ================================================================ -->
    <div class="w-full space-y-4">
        <h3 class="text-xs sm:text-sm font-bold tracking-widest font-serif text-base-content/80 uppercase border-b border-base-200 pb-2 flex items-center gap-2 select-none">
            <i class="fa-solid fa-star text-amber-500 animate-pulse"></i>
            <div class="flex flex-wrap">
                <span>My Bookmarked Favorites</span>
                <span>｜收藏清單明細</span>
            </div>
        </h3>

        <!-- ASYNCHRONOUS TARGET HOOK RE-RENDER BLOCK -->
        <div id="favorites_wrapper" class="w-full mt-4">
            {% include 'accounts/partials/favorites_list.html' with favorites=favorites %}
        </div>
    </div>
</div>
