<!-- store/partials/offers_section.html -->
{% load humanize %}
<div id="promo-container" class="space-y-5 mt-6 font-sans select-none">
    
    <!-- Offers Section Title -->
    <div>
        <h2 class="text-xs sm:text-sm font-bold tracking-wider text-base-content/80 uppercase">
            Offers｜優惠
        </h2>
    </div>

    <!-- Offer Input Core Wrapper -->
    <div id="offer-form-wrapper" class="w-full">
        {% include 'store/partials/offer_input.html' %}
    </div>

    {% if user.is_authenticated %}
    <!-- Voucher Section Title -->
    <div class="pt-2">
        <h2 class="text-xs sm:text-sm font-bold tracking-wider text-base-content/80 uppercase">
            Voucher｜現金券
        </h2>
    </div>

    <!-- Cash Voucher Dynamic Box Layer -->
    <div class="p-3.5 bg-base-100 border border-base-200 rounded-2xl shadow-sm space-y-3">
        <!-- Re-engineered Responsive Title Matrix Row -->
        <div class="flex flex-col sm:flex-row md:flex-col lg:flex-row justify-between items-start sm:items-center md:items-start lg:items-center gap-2 pb-2.5 border-b border-dashed border-base-200">
            <span class="text-xs font-semibold text-base-content/70 leading-tight">
                Cash Voucher Balance<br><span class="text-[10px] text-base-content/40 font-normal">現金券餘額</span>
            </span>
            <span id="voucher-balance" class="badge badge-neutral font-mono text-xs px-2.5 py-2.5 rounded-lg border-none tracking-wide shrink-0">
                CNY ¥ {{ cash_voucher_balance|floatformat:2|intcomma }}
            </span>
        </div>

        <!-- Voucher Input Code Form Wrapper -->
        <div id="voucher-form-wrapper" class="w-full">
            {% include 'store/partials/voucher_input.html' %}
        </div>
    </div>
    {% endif %}

</div>
