<div id="cart_summary" hx-swap-oob="true" class="border-t-2 border-dashed border-base-300 mt-6 pt-4 font-sans">
    <div class="flex justify-end gap-2 text-[0.55rem] xxs:text-[0.65rem] xs:text-xs sm:text-sm text-base-content font-normal px-4 pb-4">
        <div class="flex flex-col">
            <span>
                <span>Sub-Total</span>
                <span class="hidden xxs:inline">｜</span>
                <br class="xxs:hidden">
                <span>寶貝金額小計:</span>
            </span>
            <small id="cart_items_quantity_total" class="text-base-content/40 font-normal">
                (Total｜總 <b class="text-base-content/70 font-mono">{{new_cart_total_count}}</b> item{% if new_cart_total_count > 1 %}s{% endif %}｜件)
            </small>
        </div>
        <div id="cart_items_sub_total" class="font-mono text-xs xs:text-sm sm:text-base font-extrabold text-primary ml-1">CNY ¥ {{ formatted_new_cart_grand_total }}</div>
    </div>
</div>
