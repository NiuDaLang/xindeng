{% load humanize %}
<div id="voucher-form-wrapper" hx-swap-oob="true" class="flex flex-col sm:flex-row md:flex-col lg:flex-row items-stretch sm:items-center md:items-stretch lg:items-center justify-between gap-2.5 p-3 bg-success/5 border border-success/20 rounded-xl shadow-sm font-sans w-full min-w-0">
    <div class="grow min-w-0 flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-success text-xs shrink-0"></i>
        <span class="text-xs text-success/90 font-medium leading-normal break-words">
            CNY <strong class="font-bold font-mono bg-success/10 px-1.5 py-0.5 rounded-md text-success">¥ {{ voucher_applied|floatformat:2|intcomma }}</strong> Applied!
        </span>
    </div>
    <button hx-post="{% url 'reset_voucher' %}"
            hx-vals='{"csrfmiddlewaretoken": "{{ csrf_token }}"}'
            hx-swap="none"
            class="btn btn-ghost btn-xs text-error/80 hover:text-error hover:bg-error/5 h-auto py-1 px-2.5 min-h-0 rounded-lg shrink-0 border border-error/10 sm:border-none md:border-error/10 lg:border-none">
        <div class="flex items-center justify-center gap-1.5 text-[10px] font-bold tracking-wide">
            <span>✕</span>
            <span class="text-left leading-none">Reset<br><span class="text-[9px] font-normal opacity-60">重置</span></span>
        </div>
    </button>
</div>
