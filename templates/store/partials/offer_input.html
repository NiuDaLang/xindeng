<form hx-post="{% url 'apply_offer' %}" hx-swap="none" class="join w-full shadow-sm rounded-xl">
    {% csrf_token %}
    <input type="text" 
           name="code" 
           style="font-size: clamp(0.675rem, 1vw + 0.1rem, 0.75rem);"
           class="input input-bordered join-item w-full font-sans text-xs focus:outline-none focus:border-primary px-3 h-9 min-h-0 placeholder:text-base-content/40" 
           placeholder="Offer Code｜優惠碼" 
           required>
    <button type="submit" class="btn btn-primary join-item px-2 xxs:px-3 xs:px-4 md:max-[900px]:px-2 min-[901px]:px-4 h-9 min-h-0 text-[0.65rem] xxs:text-xs md:max-[900px]:text-[0.65rem] min-[901px]:text-xs font-semibold normal-case tracking-wide">
        Apply｜適用
    </button>
</form>
