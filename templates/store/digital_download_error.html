<!-- templates/store/digital_download_error.html -->
{% extends "base.html" %}
{% block content %}
<div class="min-h-[70dvh] flex items-center justify-center p-4 bg-base-50/10 selection:bg-error/10">
  <div class="card w-full max-w-md bg-base-100 shadow-sm border border-base-200 text-center rounded-2xl p-6 sm:p-8 space-y-4">
    
    <!-- DYNAMIC GRAPHICAL ICON SWITCH ENGINE -->
    <div class="avatar placeholder mx-auto select-none">
      {% if is_cancelled_or_revoked %}
        <!-- 🔴 Cancellation Shield Indicator Alert -->
        <div class="bg-error/10 text-error rounded-full w-16 h-16 flex items-center justify-center">
          <i class="fa-solid fa-shield-halved fa-2x"></i>
        </div>
      {% else %}
        <!-- 🕒 Standard Timeout Clock Indicator -->
        <div class="bg-warning/10 text-warning rounded-full w-16 h-16 flex items-center justify-center">
          <i class="fa-solid fa-clock-rotate-left fa-2x"></i>
        </div>
      {% endif %}
    </div>

    <!-- Dynamic Title String Injector -->
    <h2 class="text-base sm:text-lg font-serif tracking-widest font-bold uppercase {% if is_cancelled_or_revoked %}text-error{% else %}text-base-content/80{% endif %}">
      {{ error_headline }}
    </h2>

    <!-- Comprehensive Bilingual Instruction Text Box -->
    <div class="text-xs space-y-2.5 text-base-content/80 text-left bg-base-50/50 p-4 rounded-xl border border-base-200 leading-relaxed font-sans">
      <p class="font-serif font-medium text-base-content/90">{{ error_message }}</p>
      <div class="border-t border-dashed border-base-200 my-2"></div>
      <p class="opacity-70 leading-normal">{{ error_message_cn }}</p>
    </div>

    <!-- Action Navigation Segment -->
    <div class="pt-2 w-full select-none">
      <a href="{% url 'contact' %}" class="btn btn-sm btn-outline {% if is_cancelled_or_revoked %}btn-error{% else %}btn-neutral{% endif %} font-serif font-bold w-full rounded-xl tracking-wider text-xs">
        <i class="fa-solid fa-headset fa-sm"></i> Contact Support｜聯絡售後客服
      </a>
    </div>

  </div>
</div>
{% endblock %}
